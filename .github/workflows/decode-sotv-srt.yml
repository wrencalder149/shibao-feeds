name: decode-sotv-srt
on:
  workflow_dispatch:
  push:
    paths: ['tmp-srt/_encoded/sotv.part*.b64']
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import base64, gzip, pathlib, glob
          parts = sorted(glob.glob("tmp-srt/_encoded/sotv.part*.b64"))
          b64 = "".join(pathlib.Path(p).read_text().strip() for p in parts)
          raw = gzip.decompress(base64.b64decode(b64))
          pathlib.Path("tmp-srt/Shadow.of.the.Vampire.2000.tw.srt").write_bytes(raw)
          print("parts", len(parts), "decoded", len(raw))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-srt/Shadow.of.the.Vampire.2000.tw.srt
          git diff --cached --quiet || (git commit -m "chore: decode Shadow.of.the.Vampire.2000.tw.srt" && git push)
